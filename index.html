<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Szakacs Markus</title>

<style>
body{
    margin:0;
    background:#050505;
    font-family:Consolas,monospace;
    color:#00ff88;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.terminal{
    width:850px;
    max-width:95%;
    background:#0a0a0a;
    border:1px solid #00ff88;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 0 30px rgba(0,255,136,.3);
}

.topbar{
    background:#111;
    padding:12px;
    border-bottom:1px solid #00ff88;
}

.dot{
    width:12px;
    height:12px;
    border-radius:50%;
    display:inline-block;
    margin-right:6px;
}

.red{background:#ff5f56;}
.yellow{background:#ffbd2e;}
.green{background:#27c93f;}

.content{
    padding:30px;
}

.profile{
    display:flex;
    align-items:center;
    gap:25px;
    margin-bottom:30px;
}

.profile img{
    width:140px;
    height:140px;
    border-radius:50%;
    border:3px solid #00ff88;
    box-shadow:0 0 20px #00ff88;
    object-fit:cover;
}

.name{
    font-size:32px;
    font-weight:bold;
    text-shadow:0 0 10px #00ff88;
}

.subtitle{
    color:#aaa;
}

.cmd{
    color:#00ff88;
    margin-top:18px;
    min-height:24px;
}

.output{
    color:#fff;
    padding-left:20px;
    line-height:1.8;
    min-height:20px;
}

.skills{
    margin-top:10px;
}

.tag{
    display:inline-block;
    border:1px solid #00ff88;
    padding:6px 12px;
    border-radius:20px;
    margin:5px;
    color:#00ff88;
}

.cursor{
    display:inline-block;
    width:10px;
    height:18px;
    background:#00ff88;
    animation:blink 1s infinite;
    vertical-align:middle;
}

@keyframes blink{
    50%{
        opacity:0;
    }
}

.footer{
    margin-top:25px;
    color:#666;
}

.hidden{
    display:none;
}
</style>
</head>
<body>

<div class="terminal">

    <div class="topbar">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
    </div>

    <div class="content">

        <div class="profile">
            <img src="profile.jpg" alt="Profile">
            <div>
                <div class="name">Szakacs Markus</div>
                <div class="subtitle">
                    Technikliebhaber
                </div>
            </div>
        </div>

        <div class="cmd" id="cmd1"></div>
        <div class="output hidden" id="out1"></div>

        <div class="cmd" id="cmd2"></div>

        <div class="output skills hidden" id="out2">
            <span class="tag">Windows</span>
            <span class="tag">MacOS</span>
            <span class="tag">Linux</span>
            <span class="tag">Android</span>
            <span class="tag">iOS</span>
            <span class="tag">MDM</span>
        </div>

        <div class="cmd" id="cmd3"></div>
        <div class="output hidden" id="out3"></div>

        <div class="cmd hidden" id="finalPrompt">
            root@portfolio:~$
            <span class="cursor"></span>
        </div>

        <div class="footer">
            SYSTEM STATUS: ONLINE
        </div>

    </div>
</div>

<script>
function sleep(ms){
    return new Promise(resolve => setTimeout(resolve, ms));
}

function typeText(element, text, speed = 30){
    return new Promise(resolve => {

        let i = 0;

        const timer = setInterval(() => {

            if(text[i] === "\n"){
                element.innerHTML += "<br>";
            } else {
                element.innerHTML += text[i];
            }

            i++;

            if(i >= text.length){
                clearInterval(timer);
                resolve();
            }

        }, speed);

    });
}

async function startTerminal(){

    await typeText(
        document.getElementById("cmd1"),
        "root@portfolio:~$ whoami",
        35
    );

    const out1 = document.getElementById("out1");
    out1.classList.remove("hidden");

    await typeText(
        out1,
        "Ich interessiere mich für Technik, teste gern neue Tools und schaue mir an, was es Neues in der digitalen Welt gibt.",
        18
    );

    await sleep(800);

    await typeText(
        document.getElementById("cmd2"),
        "root@portfolio:~$ skills",
        35
    );

    document.getElementById("out2")
        .classList.remove("hidden");

    await sleep(800);

    await typeText(
        document.getElementById("cmd3"),
        "root@portfolio:~$ projects",
        35
    );

    const out3 = document.getElementById("out3");
    out3.classList.remove("hidden");

    await typeText(
        out3,
        "> Home Assistant\n> Proxmox\n> NAS/Backup",
        20
    );

    await sleep(500);

    document.getElementById("finalPrompt")
        .classList.remove("hidden");
}

window.onload = startTerminal;
</script>

</body>
</html>
